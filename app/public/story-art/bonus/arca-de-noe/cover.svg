<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="A Arca de Noé navegando sob o arco-íris da aliança">

  <defs>
    <linearGradient id="creamLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFBF0"/><stop offset="1" stop-color="#F3E9D7"/>
    </linearGradient>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#63AFE2"/><stop offset=".6" stop-color="#CDEEFF"/><stop offset="1" stop-color="#FFF1C7"/>
    </linearGradient>
    <linearGradient id="morningSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4B779A"/><stop offset=".4" stop-color="#F7A064"/><stop offset=".8" stop-color="#FCE0B0"/><stop offset="1" stop-color="#FFF5D6"/>
    </linearGradient>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14213D"/><stop offset=".35" stop-color="#1D4689"/><stop offset=".65" stop-color="#FF7A29"/><stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07152F"/><stop offset=".6" stop-color="#14213D"/><stop offset="1" stop-color="#1D4689"/>
    </linearGradient>
    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#121D2B"/><stop offset=".5" stop-color="#2D3E52"/><stop offset="1" stop-color="#4B627D"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2C78BD"/><stop offset=".55" stop-color="#68BDE7"/><stop offset="1" stop-color="#BDEBFA"/>
    </linearGradient>
    <linearGradient id="oceanDeep" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#08182B"/><stop offset=".5" stop-color="#133E6E"/><stop offset="1" stop-color="#246CA8"/>
    </linearGradient>
    <linearGradient id="seaWall" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1D659E" stop-opacity=".92"/><stop offset=".5" stop-color="#4FA6DF" stop-opacity=".85"/><stop offset="1" stop-color="#82D2F5" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7DBB5E"/><stop offset="1" stop-color="#2F7B45"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#94CD6E"/><stop offset=".6" stop-color="#55A14A"/><stop offset="1" stop-color="#2C6E38"/>
    </linearGradient>
    <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5DB99"/><stop offset=".65" stop-color="#DFB35A"/><stop offset="1" stop-color="#A87A2A"/>
    </linearGradient>
    <linearGradient id="sandDune" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FCEAB3"/><stop offset="1" stop-color="#E2B868"/>
    </linearGradient>
    <linearGradient id="palaceWall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF7E3"/><stop offset=".7" stop-color="#E8D5B0"/><stop offset="1" stop-color="#CBB184"/>
    </linearGradient>
    <linearGradient id="palaceGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A0"/><stop offset=".5" stop-color="#FFC93C"/><stop offset="1" stop-color="#EBA317"/>
    </linearGradient>
    <linearGradient id="woodArk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8B572A"/><stop offset=".5" stop-color="#6F3F19"/><stop offset="1" stop-color="#4A260B"/>
    </linearGradient>
    <linearGradient id="stoneDen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#283547"/><stop offset=".6" stop-color="#182332"/><stop offset="1" stop-color="#0E1622"/>
    </linearGradient>
    <linearGradient id="fireCol" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#FF4500"/><stop offset=".4" stop-color="#FF7A29"/><stop offset=".8" stop-color="#FFC93C"/><stop offset="1" stop-color="#FFF9D6"/>
    </linearGradient>
    <radialGradient id="divineLight">
      <stop stop-color="#FFFDE0" stop-opacity=".96"/><stop offset=".45" stop-color="#FFC93C" stop-opacity=".42"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="angelGlow">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset=".4" stop-color="#FFE885" stop-opacity=".55"/><stop offset="1" stop-color="#FFE885" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#FFF5B8" stop-opacity="1"/><stop offset=".35" stop-color="#FFC93C" stop-opacity=".8"/><stop offset="1" stop-color="#FF7A29" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14213D" flood-opacity=".25"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1830" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

      <rect width="1200" height="800" fill="url(#daySky)"/>
      
    <g opacity=".85">
      <path d="M120 180 q40 -50 90 -20 q50 -60 110 -15 q60 -30 100 20 q30 50 -20 60 h-260 q-50 -10 -20 -45z" fill="#FFFFFF" opacity=".7"/>
      <path d="M780 140 q35 -40 80 -15 q45 -50 95 -10 q50 -25 85 15 q25 40 -15 50 h-220 q-40 -10 -25 -40z" fill="#FFFFFF" opacity=".65"/>
      <path d="M450 210 q30 -35 70 -12 q40 -40 85 -10 q45 -20 75 12 q20 35 -15 45 h-190 q-35 -10 -25 -35z" fill="#FFFFFF" opacity=".5"/>
    </g>
      
    <g opacity=".88" filter="url(#glow)">
      <circle cx="600" cy="480" r="490" fill="none" stroke="#FF4D4D" stroke-width="14" opacity=".85"/>
      <circle cx="600" cy="480" r="476" fill="none" stroke="#FFA45C" stroke-width="14" opacity=".85"/>
      <circle cx="600" cy="480" r="462" fill="none" stroke="#FFD700" stroke-width="14" opacity=".9"/>
      <circle cx="600" cy="480" r="448" fill="none" stroke="#52C41A" stroke-width="14" opacity=".85"/>
      <circle cx="600" cy="480" r="434" fill="none" stroke="#1890FF" stroke-width="14" opacity=".85"/>
      <circle cx="600" cy="480" r="420" fill="none" stroke="#722ED1" stroke-width="14" opacity=".8"/>
    </g>
      <!-- Águas calmas do dilúvio baixando -->
      <path d="M0 520 Q300 480 600 510 T1200 490 V800 H0 Z" fill="#4B90CA"/>
      <path d="M0 580 Q400 540 800 570 T1200 550 V800 H0 Z" fill="url(#water)"/>
      <!-- Grande Arca flutuando soberana -->
      
    <g transform="translate(600 520) scale(1.2)" filter="url(#softShadow)">
      <!-- Casco inferior de madeira escura -->
      <path d="M-220 50 Q-260 0 -240 -30 L240 -30 Q260 0 220 50 C160 110 -160 110 -220 50 Z" fill="url(#woodArk)"/>
      <!-- Linhas de tábuas de gôfer -->
      <path d="M-230 -10 C-150 15 150 15 230 -10" stroke="#381D06" stroke-width="5" fill="none"/>
      <path d="M-210 20 C-140 45 140 45 210 20" stroke="#381D06" stroke-width="5" fill="none"/>
      <path d="M-180 50 C-120 70 120 70 180 50" stroke="#381D06" stroke-width="5" fill="none"/>
      <!-- Cabine superior / convés -->
      <rect x="-180" y="-105" width="360" height="75" rx="6" fill="#7A441B"/>
      <!-- Telhado inclinado -->
      <polygon points="-200,-100 0,-145 200,-100" fill="#542B0D"/>
      <!-- Janelas da arca com luz dourada -->
      
        <rect x="-150" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="-139" y1="-85" x2="-139" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="-150" y1="-72" x2="-128" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="-110" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="-99" y1="-85" x2="-99" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="-110" y1="-72" x2="-88" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="-70" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="-59" y1="-85" x2="-59" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="-70" y1="-72" x2="-48" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="-30" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="-19" y1="-85" x2="-19" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="-30" y1="-72" x2="-8" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="10" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="21" y1="-85" x2="21" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="10" y1="-72" x2="32" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="50" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="61" y1="-85" x2="61" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="50" y1="-72" x2="72" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="90" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="101" y1="-85" x2="101" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="90" y1="-72" x2="112" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
        <rect x="130" y="-85" width="22" height="26" rx="4" fill="#FFE58F" filter="url(#glow)"/>
        <line x1="141" y1="-85" x2="141" y2="-59" stroke="#542B0D" stroke-width="3"/>
        <line x1="130" y1="-72" x2="152" y2="-72" stroke="#542B0D" stroke-width="3"/>
      
      <!-- Girafa simpática espiando por uma janela -->
      <path d="M102 -75 v-40" stroke="#DF9B38" stroke-width="12" stroke-linecap="round"/>
      <circle cx="102" cy="-120" r="10" fill="#DF9B38"/>
      <circle cx="100" cy="-122" r="2.5" fill="#14213D"/>
      <!-- Passarinhos no telhado -->
      <circle cx="-60" cy="-148" r="6" fill="#FFFFFF"/>
      <circle cx="-45" cy="-146" r="6" fill="#FFFFFF"/>
    </g>
      <!-- Pomba branca com ramo no céu -->
      
    <g transform="translate(420 240) scale(1.3 1.3)" filter="url(#glow)">
      <!-- Asas brancas abertas -->
      <path d="M0 0 Q-40 -50 10 -60 Q20 -30 0 0" fill="#FFFFFF"/>
      <path d="M-10 -5 Q-30 -35 15 -45" fill="#F0F5FA"/>
      <!-- Corpo da pomba -->
      <ellipse cx="10" cy="0" rx="28" ry="16" fill="#FFFFFF"/>
      <!-- Cauda -->
      <polygon points="-15,0 -40,-12 -42,12" fill="#FFFFFF"/>
      <!-- Cabeça -->
      <circle cx="32" cy="-6" r="12" fill="#FFFFFF"/>
      <circle cx="36" cy="-8" r="2.5" fill="#14213D"/>
      <!-- Bico -->
      <polygon points="42,-7 52,-4 42,-1" fill="#FFA45C"/>
      <!-- Ramo verde de oliveira no bico -->
      <path d="M48 -3 Q65 10 75 0" stroke="#2F7B45" stroke-width="3" fill="none"/>
      <ellipse cx="58" cy="4" rx="6" ry="3" fill="#52C41A" transform="rotate(30 58 4)"/>
      <ellipse cx="68" cy="2" rx="6" ry="3" fill="#52C41A" transform="rotate(-20 68 2)"/>
    </g>
      <!-- Ondas e reflexos dourados -->
      <ellipse cx="600" cy="650" rx="320" ry="12" fill="#FFFFFF" opacity=".4"/>
    
</svg>
