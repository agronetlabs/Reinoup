<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Jonas protegido dentro do grande peixe orando a Deus">

  <defs>
    <linearGradient id="creamLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFBF0"/><stop offset="1" stop-color="#F3E9D7"/>
    </linearGradient>
    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#63AFE2"/><stop offset=".6" stop-color="#CDEEFF"/><stop offset="1" stop-color="#FFF1C7"/>
    </linearGradient>
    <linearGradient id="morningSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4B779A"/><stop offset=".4" stop-color="#F7A064"/><stop offset=".8" stop-color="#FCE0B0"/><stop offset="1" stop-color="#FFF5D6"/>
    </linearGradient>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#14213D"/><stop offset=".35" stop-color="#1D4689"/><stop offset=".65" stop-color="#FF7A29"/><stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07152F"/><stop offset=".6" stop-color="#14213D"/><stop offset="1" stop-color="#1D4689"/>
    </linearGradient>
    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#121D2B"/><stop offset=".5" stop-color="#2D3E52"/><stop offset="1" stop-color="#4B627D"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2C78BD"/><stop offset=".55" stop-color="#68BDE7"/><stop offset="1" stop-color="#BDEBFA"/>
    </linearGradient>
    <linearGradient id="oceanDeep" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#08182B"/><stop offset=".5" stop-color="#133E6E"/><stop offset="1" stop-color="#246CA8"/>
    </linearGradient>
    <linearGradient id="seaWall" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1D659E" stop-opacity=".92"/><stop offset=".5" stop-color="#4FA6DF" stop-opacity=".85"/><stop offset="1" stop-color="#82D2F5" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7DBB5E"/><stop offset="1" stop-color="#2F7B45"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#94CD6E"/><stop offset=".6" stop-color="#55A14A"/><stop offset="1" stop-color="#2C6E38"/>
    </linearGradient>
    <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F5DB99"/><stop offset=".65" stop-color="#DFB35A"/><stop offset="1" stop-color="#A87A2A"/>
    </linearGradient>
    <linearGradient id="sandDune" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FCEAB3"/><stop offset="1" stop-color="#E2B868"/>
    </linearGradient>
    <linearGradient id="palaceWall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF7E3"/><stop offset=".7" stop-color="#E8D5B0"/><stop offset="1" stop-color="#CBB184"/>
    </linearGradient>
    <linearGradient id="palaceGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0A0"/><stop offset=".5" stop-color="#FFC93C"/><stop offset="1" stop-color="#EBA317"/>
    </linearGradient>
    <linearGradient id="woodArk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8B572A"/><stop offset=".5" stop-color="#6F3F19"/><stop offset="1" stop-color="#4A260B"/>
    </linearGradient>
    <linearGradient id="stoneDen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#283547"/><stop offset=".6" stop-color="#182332"/><stop offset="1" stop-color="#0E1622"/>
    </linearGradient>
    <linearGradient id="fireCol" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#FF4500"/><stop offset=".4" stop-color="#FF7A29"/><stop offset=".8" stop-color="#FFC93C"/><stop offset="1" stop-color="#FFF9D6"/>
    </linearGradient>
    <radialGradient id="divineLight">
      <stop stop-color="#FFFDE0" stop-opacity=".96"/><stop offset=".45" stop-color="#FFC93C" stop-opacity=".42"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="angelGlow">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/><stop offset=".4" stop-color="#FFE885" stop-opacity=".55"/><stop offset="1" stop-color="#FFE885" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop stop-color="#FFF5B8" stop-opacity="1"/><stop offset=".35" stop-color="#FFC93C" stop-opacity=".8"/><stop offset="1" stop-color="#FF7A29" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14213D" flood-opacity=".25"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1830" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

      <rect width="1200" height="800" fill="url(#oceanDeep)"/>
      <!-- Bolhas luminosas no fundo do mar -->
      <circle cx="23" cy="45" r="6" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="70" cy="76" r="10" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="117" cy="107" r="14" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="164" cy="138" r="18" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="211" cy="169" r="22" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="258" cy="200" r="6" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="305" cy="231" r="10" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="352" cy="262" r="14" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="399" cy="293" r="18" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="446" cy="324" r="22" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="493" cy="355" r="6" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="540" cy="386" r="10" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="587" cy="417" r="14" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="634" cy="448" r="18" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="681" cy="479" r="22" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="728" cy="510" r="6" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="775" cy="541" r="10" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="822" cy="572" r="14" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="869" cy="603" r="18" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="916" cy="634" r="22" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="963" cy="665" r="6" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="1010" cy="696" r="10" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="1057" cy="727" r="14" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="1104" cy="8" r="18" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="1151" cy="39" r="22" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="1198" cy="70" r="6" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="45" cy="101" r="10" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="92" cy="132" r="14" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="139" cy="163" r="18" fill="#68BDE7" opacity=".45" filter="url(#glow)"/><circle cx="186" cy="194" r="22" fill="#68BDE7" opacity=".45" filter="url(#glow)"/>
      <!-- Corais coloridos no leito do oceano -->
      <path d="M120 800 Q150 680 180 720 Q210 650 250 800 Z" fill="#FF7A29"/>
      <path d="M950 800 Q980 670 1020 710 Q1050 640 1090 800 Z" fill="#FFC93C"/>
      <!-- O grande peixe nadando com tranquilidade no fundo -->
      
    <g transform="translate(600 420) scale(1.85 1.85)" filter="url(#softShadow)">
      <!-- Corpo enorme e amigável do grande peixe -->
      <ellipse cx="0" cy="0" rx="160" ry="95" fill="#1D4689"/>
      <ellipse cx="20" cy="15" rx="130" ry="70" fill="#2C78BD"/>
      <ellipse cx="30" cy="35" rx="100" ry="45" fill="#68BDE7"/>
      <!-- Cauda poderosa -->
      <path d="M-130 0 L-220 -80 Q-180 0 -220 80 Z" fill="#1D4689"/>
      <!-- Nadadeiras -->
      <path d="M-40 40 Q-70 110 -20 120 Q0 80 -20 45" fill="#133E6E"/>
      <path d="M20 -80 Q40 -120 70 -85 Q50 -60 25 -70" fill="#133E6E"/>
      <!-- Olho grande, simpático e expressivo -->
      <circle cx="85" cy="-25" r="22" fill="#FFFFFF"/>
      <circle cx="92" cy="-25" r="12" fill="#14213D"/>
      <circle cx="96" cy="-29" r="4.5" fill="#FFFFFF"/>
      <!-- Sorriso gentil -->
      <path d="M80 15 Q115 35 140 10" stroke="#0B1830" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Jato de água espirrando do topo -->
      <g filter="url(#glow)">
        <path d="M60 -95 Q65 -150 45 -180" stroke="#BDEBFA" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M65 -95 Q90 -160 110 -175" stroke="#BDEBFA" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="45" cy="-185" r="7" fill="#FFFFFF"/>
        <circle cx="110" cy="-180" r="7" fill="#FFFFFF"/>
      </g>
    </g>
      <!-- Jonas em oração protegido dentro do peixe -->
      <g transform="translate(620 420)" filter="url(#strongGlow)">
        <ellipse cx="0" cy="0" rx="75" ry="90" fill="#FFFDE0" opacity=".35"/>
        
    <g transform="translate(0 10) scale(0.95)" filter="url(#softShadow)">
      <!-- Túnica simples -->
      <path d="M-30 30 Q0 5 30 30 L38 150 H-38 Z" fill="#D97736"/>
      <path d="M-22 40 Q0 60 22 40 L26 140 H-26 Z" fill="#F5E8D3"/>
      <!-- Cabeça de Jonas -->
      <circle cx="0" cy="-25" r="26" fill="#E8B084"/>
      <!-- Cabelo e barba castanho-escuro -->
      <path d="M-26 -28 C-26 -55 26 -55 26 -28 Z" fill="#4A260B"/>
      <path d="M-22 -10 Q0 45 22 -10 Q16 35 0 38 Q-16 35 -22 -10 Z" fill="#4A260B"/>
      <circle cx="-9" cy="-26" r="3.5" fill="#14213D"/>
      <circle cx="9" cy="-26" r="3.5" fill="#14213D"/>
      
        <!-- Mãos postas em oração sincera -->
        <ellipse cx="0" cy="30" rx="14" ry="18" fill="#E8B084"/>
        <circle cx="0" cy="15" r="60" fill="#FFF8C5" opacity=".35" filter="url(#glow)"/>
      
    </g>
      </g>
    
</svg>
